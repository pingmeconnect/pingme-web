<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PingMe Story Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 50% 10%,#183c79,#06152e 62%,#020817);color:#fff}body{display:flex;justify-content:center;align-items:center;padding:12px}
.phone{width:min(100%,390px);min-height:min(820px,calc(100dvh - 24px));border:1px solid rgba(125,211,252,.35);border-radius:28px;background:linear-gradient(155deg,#071c3c,#171a50 65%,#38145a);box-shadow:0 22px 70px #0009;overflow:hidden;display:flex;flex-direction:column}
.header{height:68px;flex:0 0 68px;background:#f7faff;color:#10234a;display:flex;align-items:center;justify-content:space-between;padding:10px 15px}.brand{font-weight:1000;font-size:18px;color:#153b88}.tagline{font-size:8px;font-weight:900;letter-spacing:.04em}.lang{border:0;border-radius:99px;padding:8px 12px;background:#073b80;color:white;font-weight:900}
.status{padding:14px 14px 6px;text-align:center}.ping{display:inline-block;border-radius:99px;padding:10px 22px;background:linear-gradient(#20d86a,#07943c);font-weight:1000;font-size:20px;box-shadow:0 0 16px #22c55e66}.wait{font-weight:900;margin-top:8px}
.timerrow{display:flex;align-items:center;justify-content:center;gap:18px;padding:7px 10px 12px}.mascot{width:82px;height:82px;object-fit:contain}.timer{width:88px;height:88px;border-radius:50%;border:6px solid #4c9df2;border-right-color:#b44ce4;border-bottom-color:#b44ce4;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:36px;font-weight:1000}.timer small{font-size:9px;letter-spacing:.08em}
.story{margin:0 11px 12px;padding:10px;border:1px solid #4c83ae;border-radius:17px;background:linear-gradient(145deg,#10294e,#29164f);display:flex;flex-direction:column;gap:9px;flex:1;min-height:0}.scene{width:100%;height:min(38vh,350px);min-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:12px;background:#07162d}.scene img{width:100%;height:100%;object-fit:contain;display:block}
.caption{font-size:clamp(16px,4.3vw,19px);font-weight:900;line-height:1.28;text-align:center;min-height:52px;display:flex;align-items:center;justify-content:center;padding:0 4px}.progress{height:4px;background:#ffffff30;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#f472b6)}
.controls{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap}.controls button{border:0;border-radius:99px;padding:10px 17px;color:white;font-weight:1000;background:linear-gradient(100deg,#0ea5e9,#5b45e8 55%,#db2777)}.controls .secondary{background:#27466e;border:1px solid #7dd3fc}.why{align-self:center;border:1px solid #fff;border-radius:99px;padding:10px 22px;background:linear-gradient(100deg,#0ea5e9,#5b45e8 55%,#db2777);font-weight:1000}.note{font-size:10px;color:#cbd5e1;text-align:center;padding:0 10px 10px}
@media(max-height:700px){.status{padding:8px 10px 3px}.timerrow{padding:3px 8px 7px}.mascot{width:64px;height:64px}.timer{width:70px;height:70px;font-size:28px}.scene{height:31vh;min-height:150px}.caption{min-height:42px;font-size:15px}.story{gap:6px;padding:8px}}
</style></head><body><main class="phone">
<header class="header"><div><div class="brand">✦ PingMe</div><div class="tagline">ONE SCAN. INSTANT CONNECTION.</div></div><button class="lang" id="langBtn">English | தமிழ்</button></header>
<section class="status"><div class="ping">✓ PING SENT!</div><div class="wait" id="waitText">Waiting for reply...</div></section>
<div class="timerrow"><img class="mascot" src="assets/boy-waiting.png" alt="PingMe mascot"><div class="timer"><span id="seconds">180</span><small>SECONDS</small></div></div>
<section class="story"><div class="scene"><img id="sceneImg" src="assets/pingme-stories/vehicle_01_blocked.png" alt="PingMe story scene"></div><div class="caption" id="caption"></div><div class="progress"><span id="bar"></span></div><div class="controls"><button class="secondary" id="prev">← BACK</button><button id="next">NEXT →</button></div><button class="why" id="why">WHY PINGME?</button></section>
<div class="note" id="note">Preview only — no alert, WhatsApp message, or backend session will be created.</div></main>
<script>
const scenes=[["vehicle_01_blocked.png", "vehicle", "My car is blocked! How do I reach the owner?", "அடடா! என் காரை யாரோ மறிச்சு நிறுத்திட்டாங்களே! உரிமையாளரை எப்படி தொடர்பு கொள்வது?"], ["vehicle_02_qr_found.png", "vehicle", "I spotted a PingMe QR sticker on the vehicle.", "வண்டியில் PingMe QR ஸ்டிக்கர் இருக்கு பாருங்க!"], ["vehicle_03_scan.png", "vehicle", "I’ll scan it and send an alert with a photo and my location.", "QR-ஐ ஸ்கேன் பண்ணி, போட்டோவும் இருக்கும் இடத்தையும் அனுப்புறேன்."], ["vehicle_04_alert_sent.png", "vehicle", "The owner gets the alert and can reply privately.", "உரிமையாளருக்கு உடனே தகவல் போயிடும். அவர் தனியாக பதிலும் அனுப்பலாம்."], ["vehicle_05_owner_moves.png", "vehicle", "The owner replies and comes to move the vehicle. Problem solved!", "உரிமையாளர் பதில் அனுப்பிட்டு வந்து வண்டியை எடுத்துட்டார். பிரச்சினை தீர்ந்தது!"], ["vehicle_06_buy.png", "vehicle", "I want this! How can I get it? — Just click BUY!", "எனக்கும் இது வேணும்! எப்படிக் கிடைக்கும்? — BUY-ஐ அழுத்துங்க!"], ["bag_01_found.png", "bag", "Someone has left a bag here. I should help find its owner.", "இந்தப் பை யாரோடதுன்னு தெரியலையே… உரிமையாளரிடம் சேர்க்கணும்."], ["bag_02_qr_tag.png", "bag", "There’s a PingMe QR tag on the bag.", "அட, பையில் PingMe QR tag இருக்கு!"], ["bag_03_scan.png", "bag", "I’ll scan the QR and send a photo and location.", "QR-ஐ ஸ்கேன் பண்ணி, போட்டோவும் இடத்தையும் அனுப்புறேன்."], ["bag_04_alert_sent.png", "bag", "The owner receives the alert and replies. No need to exchange phone numbers.", "உரிமையாளருக்கு தகவல் போயிடுச்சு. அவர் பதிலும் அனுப்பிட்டார். நம்பர் பகிர வேண்டியதில்லை."], ["bag_05_returned.png", "bag", "The owner arrives and gets the bag back safely.", "உரிமையாளர் வந்துட்டார். பையும் பத்திரமா கிடைச்சுடுச்சு!"], ["bag_06_buy.png", "bag", "I want this! How can I get it? — Just click BUY!", "எனக்கும் இப்படியொரு tag வேணும்! — BUY-ஐ அழுத்துங்க!"], ["pet_01_family.png", "pet", "Jimmy is part of our family. We love him so much!", "ஜிம்மி எங்க வீட்டுப் பிள்ளை மாதிரி. எங்களுக்கு ரொம்பப் பிரியமானவன்!"], ["pet_02_missing.png", "pet", "Oh no! Jimmy is missing. I’ve searched everywhere!", "ஐயையோ! ஜிம்மியைக் காணோம்! எங்கெல்லாமோ தேடிட்டேன்… கிடைக்கவே இல்லையே!"], ["pet_03_found.png", "pet", "A kind person finds Jimmy wearing his PingMe QR tag.", "அதிர்ஷ்டவசமா, ஒருத்தர் ஜிம்மியைப் பார்த்தார். அவன் கழுத்தில் PingMe QR tag இருந்தது."], ["pet_04_scan.png", "pet", "They scan the tag and send Jimmy’s photo and location.", "அந்த QR-ஐ ஸ்கேன் பண்ணி, ஜிம்மியின் போட்டோவையும் இருக்கும் இடத்தையும் அனுப்பினார்."], ["pet_05_owner_alert.png", "pet", "The owner gets the alert: “That’s my Jimmy! Thank you. I’m coming!”", "உரிமையாளருக்கு தகவல் வந்ததும், “அட, என் ஜிம்மி! ரொம்ப நன்றி. உடனே வர்றேன்!”ன்னு பதில் அனுப்பினார்."], ["pet_06_reunion.png", "pet", "Jimmy is home again! One scan brings loved ones together.", "ஜிம்மி திரும்ப வீட்டுக்கு வந்துட்டான்! ஒரு ஸ்கேன் குடும்பத்தை மீண்டும் சேர்த்தது."], ["pet_07_message.png", "pet", "No need to exchange personal phone numbers. One scan. Instant connection.", "தனிப்பட்ட மொபைல் நம்பரைப் பகிர வேண்டாம். ஒரே ஸ்கேன்… உடனடி தொடர்பு!"]];
let i=0,lang='en',remaining=180;
const img=document.getElementById('sceneImg'),cap=document.getElementById('caption'),bar=document.getElementById('bar');
function render(){const s=scenes[i];img.src='assets/pingme-stories/'+s[0];cap.textContent=lang==='ta'?s[3]:s[2];bar.style.width=((i+1)/scenes.length*100)+'%';document.getElementById('next').textContent=i===scenes.length-1?(lang==='ta'?'மீண்டும் தொடங்கு ↻':'RESTART ↻'):(lang==='ta'?'அடுத்து →':'NEXT →');document.getElementById('prev').textContent=lang==='ta'?'← பின் செல்ல':'← BACK';document.getElementById('why').textContent=lang==='ta'?'ஏன் PINGME?':'WHY PINGME?';document.getElementById('waitText').textContent=lang==='ta'?'பதிலுக்காக காத்திருக்கிறது...':'Waiting for reply...';}
function next(){i=(i+1)%scenes.length;render()}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=()=>{i=(i-1+scenes.length)%scenes.length;render()};
document.getElementById('langBtn').onclick=()=>{lang=lang==='en'?'ta':'en';render()};
document.getElementById('why').onclick=()=>{alert(lang==='ta'?'உங்கள் மொபைல் எண்ணைப் பகிராமல், ஒரே QR ஸ்கேன் மூலம் தொடர்பு கொள்ளலாம்.':'Connect through one QR scan without exchanging personal phone numbers.')};
render();setInterval(()=>{if(remaining>0)remaining--;document.getElementById('seconds').textContent=remaining},1000);setInterval(next,5000);
</script></body></html>
