ஏன் தேவை", "Event": "நிகழ்வு", "Credit used": "கிரெடிட் செலவு", "What to try": "முயற்சிக்க"}, "sections": [{"n": 1, "t": ["Welcome and your kit", "வரவேற்பு மற்றும் உங்கள் கிட்"], "sub": null, "cont": false, "blocks": [["h", "1.1", "About PingMe", "PingMe பற்றி"], ["p", "PingMe gives your vehicle, bag and belongings their own QR code. When someone finds your item, or needs to reach you about your vehicle, they scan the QR and send a message. You receive it as an instant WhatsApp alert and can reply. The person scanning does not need an app, and your phone number is not shown to them.", "PingMe உங்கள் வாகனம், பை மற்றும் பொருட்களுக்கு தனித்தனி QR குறியீடு தருகிறது. உங்கள் பொருள் யாருக்காவது கிடைத்தாலோ, வாகனம் தொடர்பாக உங்களைத் தொடர்பு கொள்ள வேண்டியிருந்தாலோ, அவர்கள் QR-ஐ ஸ்கேன் செய்து செய்தி அனுப்புவார்கள். அது உங்களுக்கு உடனடி WhatsApp அறிவிப்பாக வரும்; நீங்கள் பதிலும் அனுப்பலாம். ஸ்கேன் செய்பவருக்கு செயலி தேவையில்லை; உங்கள் தொலைபேசி எண்ணும் அவர்களுக்குத் தெரியாது."], ["h", "1.2", "What is in your kit", "உங்கள் கிட்டில் உள்ளவை"], ["tbl", ["Item", "Qty", "Use"], [[["Transparent car holders", "வெளிப்படையான கார் ஹோல்டர்"], ["2", "2"], ["Hold the PVC card inside the car glass", "PVC கார்டை காரின் கண்ணாடி உள்ளே பிடித்து வைக்கும்"]], [["PVC cards", "PVC கார்டுகள்"], ["2", "2"], ["The QR sticker is pressed onto the card", "QR ஸ்டிக்கர் இந்த கார்டில் ஒட்டப்படும்"]], [["Car QR stickers", "கார் QR ஸ்டிக்கர்"], ["2", "2"], ["Front glass and rear glass", "முன் மற்றும் பின் கண்ணாடி"]], [["Bike QR stickers", "பைக் QR ஸ்டிக்கர்"], ["2", "2"], ["For your two-wheeler", "உங்கள் இருசக்கர வாகனத்திற்கு"]], [["Luggage QR stickers", "பை QR ஸ்டிக்கர்"], ["3", "3"], ["For bags and cases", "பைகள் மற்றும் பெட்டிகளுக்கு"]], [["Plastic luggage tags", "பிளாஸ்டிக் பை டேக்"], ["3", "3"], ["Attach to handles and straps", "கைப்பிடி, பட்டையில் இணைக்க"]], [["Acrylic keychains", "அக்ரிலிக் கீசெயின்"], ["2", "2"], ["For keys or a bag zip", "சாவி அல்லது பை ஜிப்பிற்கு"]], [["This guide", "இந்த வழிகாட்டி"], ["1", "1"], ["Keep it with your kit documents", "கிட் ஆவணங்களுடன் பத்திரமாக வைக்கவும்"]]]], ["p", "Please check the items against this list when you open the box. If anything is missing, see section 8.", "பெட்டியைத் திறந்ததும் இந்தப் பட்டியலுடன் பொருட்களைச் சரிபாருங்கள். ஏதேனும் குறைந்தால் பிரிவு 8-ஐப் பாருங்கள்."], ["h", "1.3", "One code for everything", "எல்லாவற்றிற்கும் ஒரே குறியீடு"], ["p", "Every QR in your kit carries the same Customer ID, printed beside the QR. A scan of any one of them alerts you, so you can use them on different items.", "உங்கள் கிட்டில் உள்ள எல்லா QR-களிலும் QR அருகே அச்சிடப்பட்ட ஒரே வாடிக்கையாளர் ஐடி உள்ளது. எதை ஸ்கேன் செய்தாலும் உங்களுக்கு அறிவிப்பு வரும்; எனவே வெவ்வேறு பொருட்களில் பயன்படுத்தலாம்."], ["h", "1.4", "What your purchase includes", "உங்கள் கொள்முதலில் அடங்குவது"], ["tbl", null, [[["Service period", "சேவைக் காலம்"], ["1 year, counted from the day you activate your kit", "கிட்டை செயல்படுத்திய நாளிலிருந்து 1 ஆண்டு"]], [["Alerts included", "சேர்க்கப்பட்ட அறிவிப்புகள்"], ["250 alerts (credits), added when you activate", "250 அறிவிப்புகள் (கிரெடிட்), செயல்படுத்தும்போது சேர்க்கப்படும்"]], [["After the first year", "முதல் ஆண்டுக்குப் பின்"], ["Renew to keep the service running (section 7)", "சேவை தொடர புதுப்பிக்கவும் (பிரிவு 7)"]]]], ["note", "**Before you begin:** your kit must be activated before the QR can alert you. Go to section 3.", "**தொடங்கும் முன்:** QR உங்களுக்கு அறிவிப்பு அனுப்ப, கிட் செயல்படுத்தப்பட வேண்டும். பிரிவு 3-க்குச் செல்லுங்கள்."]]}, {"n": 2, "t": ["How PingMe works", "PingMe எப்படி வேலை செய்கிறது"], "sub": null, "cont": false, "blocks": [["h", "2.1", "The journey of one alert", "ஒரு அறிவிப்பின் பயணம்"], ["flow", [["Scan", "ஸ்கேன்", "Someone scans your QR", "யாரோ உங்கள் QR-ஐ ஸ்கேன் செய்கிறார்"], ["Choose", "தேர்வு", "They pick a reason", "காரணத்தைத் தேர்ந்தெடுக்கிறார்"], ["Alert", "அறிவிப்பு", "You get a WhatsApp message", "உங்களுக்கு WhatsApp செய்தி வரும்"], ["Reply", "பதில்", "You answer on WhatsApp", "WhatsApp-ல் பதில் அனுப்புகிறீர்கள்"]]], ["h", "2.2", "What the person scanning does", "ஸ்கேன் செய்பவர் செய்வது"], ["ul", [["Opens their phone camera and scans your QR. No app or sign-up is needed.", "தொலைபேசி கேமராவில் உங்கள் QR-ஐ ஸ்கேன் செய்வார். செயலியோ பதிவோ தேவையில்லை."], ["Chooses a reason: Vehicle, Lost and found or Other.", "காரணத்தைத் தேர்ந்தெடுப்பார்: வாகனம், தொலைந்த/கிடைத்த பொருள் அல்லது மற்றவை."], ["May choose to add a photo and share their location with the message.", "விரும்பினால் புகைப்படம் மற்றும் இருப்பிடத்தையும் செய்தியுடன் பகிரலாம்."], ["Taps send. They see a confirmation that the owner has been alerted.", "அனுப்பு என்பதை அழுத்துவார். உரிமையாளருக்கு அறிவிக்கப்பட்டதாக உறுதிப்படுத்தல் காண்பார்."]]], ["h", "2.3", "What you receive", "உங்களுக்கு வருவது"], ["ul", [["A WhatsApp message from PingMe on +91 91500 47587, with the reason and any photo or location the person chose to share.", "+91 91500 47587 என்ற PingMe எண்ணிலிருந்து WhatsApp செய்தி வரும்; அதில் காரணம் மற்றும் அவர் பகிர்ந்த புகைப்படம் அல்லது இருப்பிடம் இருக்கும்."], ["You can reply on WhatsApp. PingMe passes your reply to the person who scanned.", "நீங்கள் WhatsApp-ல் பதில் அனுப்பலாம். உங்கள் பதிலை PingMe ஸ்கேன் செய்தவரிடம் சேர்க்கும்."], ["Save +91 91500 47587 in your phone as PingMe so the alerts are easy to recognise.", "அறிவிப்புகளை எளிதில் அடையாளம் காண +91 91500 47587 எண்ணை “PingMe” என்று சேமித்துக் கொள்ளுங்கள்."], ["If you add a second number or an alert email (sections 6 and 5), they receive the alert as well.", "இரண்டாவது எண் அல்லது அறிவிப்பு மின்னஞ்சல் சேர்த்தால் (பிரிவு 6, 5) அவர்களுக்கும் அறிவிப்பு செல்லும்."]]], ["h", "2.4", "Your phone number stays private", "உங்கள் தொலைபேசி எண் ரகசியமாக இருக்கும்"], ["p", "The scan page does not show your phone number. The conversation runs through PingMe. Share your number yourself only if you choose to in your reply.", "ஸ்கேன் பக்கம் உங்கள் தொலைபேசி எண்ணைக் காட்டாது. உரையாடல் PingMe வழியாக நடக்கும். உங்கள் பதிலில் நீங்களே விரும்பினால் மட்டும் எண்ணைப் பகிருங்கள்."], ["h", "2.5", "What does and does not use a credit", "எதற்கு கிரெடிட் செலவாகும், எதற்கு ஆகாது"], ["ul", [["Scanning your QR, or opening the page, does not use a credit.", "QR-ஐ ஸ்கேன் செய்வதற்கோ பக்கத்தைத் திறப்பதற்கோ கிரெடிட் செலவாகாது."], ["One credit is used for each alert that is delivered to you. If WhatsApp does not accept an alert, no credit is deducted.", "உங்களுக்கு வந்து சேரும் ஒவ்வொரு அறிவிப்புக்கும் ஒரு கிரெடிட் செலவாகும். WhatsApp ஏற்காவிட்டால் கிரெடிட் குறைக்கப்படாது."]]], ["note", "**Test it safely:** scan your own QR from another phone to see the page. Press send only if you want a real test alert, because it uses one credit.", "**பாதுகாப்பாகச் சோதிக்க:** வேறு தொலைபேசியில் உங்கள் QR-ஐ ஸ்கேன் செய்து பக்கத்தைப் பாருங்கள். உண்மையான சோதனை அறிவிப்பு வேண்டுமானால் மட்டுமே அனுப்பு அழுத்துங்கள்; அதற்கு ஒரு கிரெடிட் செலவாகும்."]]}, {"n": 3, "t": ["Activate your kit", "கிட்டை செயல்படுத்துங்கள்"], "sub": null, "cont": false, "blocks": [["h", "3.1", "What you need", "தேவையானவை"], ["ul", [["Your Customer ID, printed beside the QR on your kit (for example PM-7K3QX9AB).", "கிட்டில் QR அருகே அச்சிடப்பட்டுள்ள வாடிக்கையாளர் ஐடி (எ.கா. PM-7K3QX9AB)."], ["The WhatsApp number you gave us when you ordered. Activation only works from this number.", "ஆர்டர் செய்தபோது நீங்கள் தந்த WhatsApp எண். செயல்படுத்தல் இந்த எண்ணிலிருந்து மட்டுமே வேலை செய்யும்."], ["An internet connection and about three minutes.", "இணைய இணைப்பு மற்றும் சுமார் மூன்று நிமிடம்."]]], ["h", "3.2", "Five steps", "ஐந்து படிகள்"], ["ol", [["**Find your Customer ID.** Write it on the cover of this guide so you can find it later.", "**வாடிக்கையாளர் ஐடியைக் கண்டறியுங்கள்.** பின்னர் எளிதில் காண இந்த வழிகாட்டியின் அட்டையில் எழுதிக் கொள்ளுங்கள்."], ["**Send an activation message.** From your registered WhatsApp number, send ACTIVATE followed by your ID, for example ACTIVATE PM-7K3QX9AB, to +91 91500 47587. You will receive a 6-digit code on WhatsApp.", "**செயல்படுத்தும் செய்தி அனுப்புங்கள்.** பதிவு செய்த WhatsApp எண்ணிலிருந்து ACTIVATE என்று எழுதி உங்கள் ஐடியுடன், எ.கா. ACTIVATE PM-7K3QX9AB, +91 91500 47587 எண்ணுக்கு அனுப்புங்கள். WhatsApp-ல் 6 இலக்க குறியீடு வரும்."], ["**Open the activation page.** Go to pingmeconnect.in/activate. Enter your Customer ID and the 6-digit code.", "**செயல்படுத்தும் பக்கத்தைத் திறக்கவும்.** pingmeconnect.in/activate-க்குச் சென்று வாடிக்கையாளர் ஐடி மற்றும் 6 இலக்க குறியீட்டை உள்ளிடுங்கள்."], ["**Create your password.** Use at least 8 characters, with at least one letter and one number. Enter it twice.", "**கடவுச்சொல் உருவாக்குங்கள்.** குறைந்தது 8 எழுத்துகள், ஒரு எழுத்து மற்றும் ஒரு எண் இருக்க வேண்டும். இரண்டு முறை உள்ளிடுங்கள்."], ["**Accept and activate.** Read the Genuine Use Declaration, Terms and Privacy Policy, tick the box and tap Activate Account. The button works only after you tick the box.", "**ஏற்று செயல்படுத்துங்கள்.** உண்மையான பயன்பாட்டு உறுதிமொழி, விதிமுறைகள், தனியுரிமைக் கொள்கையைப் படித்து, பெட்டியில் டிக் செய்து Activate Account அழுத்துங்கள். டிக் செய்த பின்னரே பொத்தான் வேலை செய்யும்."]]], ["h", "3.3", "What happens next", "அடுத்து என்ன நடக்கும்"], ["ul", [["Your account becomes Active and your QR starts alerting you.", "உங்கள் கணக்கு செயலில் வரும்; QR உங்களுக்கு அறிவிப்பு அனுப்பத் தொடங்கும்."], ["Your 1-year service period begins today, and your 250 alerts are added.", "உங்கள் 1 ஆண்டு சேவைக் காலம் இன்றே தொடங்கும்; 250 அறிவிப்புகள் சேர்க்கப்படும்."], ["You can now sign in at pingmeconnect.in/account (section 5).", "இப்போது pingmeconnect.in/account-ல் உள்நுழையலாம் (பிரிவு 5)."]]], ["h", "3.4", "If activation does not work", "செயல்படுத்தல் வேலை செய்யாவிட்டால்"], ["tbl", ["Problem", "What to do"], [[["No code arrives", "குறியீடு வரவில்லை"], ["Check you sent the message from your registered number and typed the ID exactly. Send it again.", "பதிவு செய்த எண்ணிலிருந்து அனுப்பினீர்களா, ஐடியைச் சரியாக எழுதினீர்களா எனப் பாருங்கள். மீண்டும் அனுப்புங்கள்."]], [["Code expired", "குறியீடு காலாவதி"], ["Codes work for a short time. Send ACTIVATE again for a new code.", "குறியீடு சிறிது நேரமே செல்லும். புதிய குறியீட்டிற்கு மீண்டும் ACTIVATE அனுப்புங்கள்."]], [["Wrong code several times", "பல முறை தவறான குறியீடு"], ["The code is locked after repeated mistakes. Request a new code on WhatsApp.", "தொடர் தவறுகளுக்குப் பின் குறியீடு பூட்டப்படும். WhatsApp-ல் புதிய குறியீடு கேளுங்கள்."]], [["ID not recognised", "ஐடி அடையாளம் காணப்படவில்லை"], ["Check each character against the printed ID. Still stuck? Contact support (section 13).", "அச்சிடப்பட்ட ஐடியுடன் ஒவ்வொரு எழுத்தையும் சரிபாருங்கள். இன்னும் சிக்கலா? ஆதரவைத் தொடர்பு கொள்ளுங்கள் (பிரிவு 13)."]]]]]}, {"n": 4, "t": ["Placing your QR", "QR-ஐ ஒட்டுதல்"], "sub": ["Part A: your car", "பகுதி A: உங்கள் கார்"], "cont": false, "blocks": [["part", "Part A: your car", "பகுதி A: உங்கள் கார்"], ["h", "4.1", "What you need", "தேவையானவை"], ["p", "Two transparent holders, two PVC cards and two car QR stickers from your kit, and a clean, dry cloth.", "கிட்டில் உள்ள இரண்டு வெளிப்படையான ஹோல்டர், இரண்டு PVC கார்டு, இரண்டு கார் QR ஸ்டிக்கர் மற்றும் சுத்தமான, உலர்ந்த துணி."], ["h", "4.2", "Prepare each card", "ஒவ்வொரு கார்டையும் தயார் செய்யுங்கள்"], ["ol", [["Peel a QR sticker from its backing sheet.", "QR ஸ்டிக்கரை அதன் பின் தாளிலிருந்து உரியுங்கள்."], ["Press it flat onto the PVC card, centred, with no air bubbles.", "PVC கார்டின் நடுவில், காற்றுக் குமிழ் இல்லாமல் சமமாக அழுத்தி ஒட்டுங்கள்."], ["Slide the card into the transparent holder.", "கார்டை வெளிப்படையான ஹோல்டருக்குள் செருகுங்கள்."]]], ["h", "4.3", "Fix the holder to the glass", "ஹோல்டரை கண்ணாடியில் ஒட்டுங்கள்"], ["ol", [["Wipe the inside of the glass clean and let it dry.", "கண்ணாடியின் உட்புறத்தைத் துடைத்து உலர விடுங்கள்."], ["Peel the holder's backing and press the holder firmly for about 30 seconds.", "ஹோல்டரின் பின் தாளை உரித்து, சுமார் 30 விநாடிகள் உறுதியாக அழுத்துங்கள்."], ["Face the QR outward, so a person standing outside can scan it through the glass. Do the same on the rear glass with the second holder.", "வெளியே நிற்பவர் கண்ணாடி வழியாக ஸ்கேன் செய்யும்படி QR வெளிப்புறம் பார்க்க வையுங்கள். இரண்டாவது ஹோல்டரை பின் கண்ணாடியிலும் இதே போல் ஒட்டுங்கள்."]]], ["h", "4.4", "Choose the position carefully", "இடத்தை கவனமாகத் தேர்ந்தெடுங்கள்"], ["ul", [["Use a lower corner of the glass, away from the driver's line of sight.", "ஓட்டுநரின் பார்வைக் கோட்டிலிருந்து விலகி, கண்ணாடியின் கீழ் மூலையைப் பயன்படுத்துங்கள்."], ["Keep it clear of the wiper sweep and of any stickers or labels you are required to display.", "வைப்பர் துடைக்கும் பகுதியிலும், கட்டாயம் ஒட்ட வேண்டிய ஸ்டிக்கர்/லேபிள்களின் மேலும் வராமல் பார்த்துக் கொள்ளுங்கள்."], ["Do not hang anything from the rear-view mirror.", "பின்பார்வைக் கண்ணாடியில் எதையும் தொங்கவிடாதீர்கள்."]]], ["warn", "**Your responsibility.** Under the Central Motor Vehicles Rules, the view through a vehicle's glass must not be obstructed, and glass must meet the required light-transmission limits. Fix the holder only where it does not reduce the driver's view, and follow the rules that apply in your state. Remove it if a traffic officer asks you to.", "**உங்கள் பொறுப்பு.** மத்திய மோட்டார் வாகன விதிகளின்படி வாகனக் கண்ணாடி வழியான பார்வை தடைபடக் கூடாது; கண்ணாடி தேவையான ஒளி ஊடுருவல் அளவையும் பூர்த்தி செய்ய வேண்டும். ஓட்டுநர் பார்வை குறையாத இடத்தில் மட்டும் ஹோல்டரை ஒட்டுங்கள்; உங்கள் மாநில விதிகளைப் பின்பற்றுங்கள். போக்குவரத்து அதிகாரி கேட்டால் அகற்றி விடுங்கள்."], ["note", "**Tip:** after fixing, scan the QR from outside with another phone to confirm it reads clearly in daylight.", "**குறிப்பு:** ஒட்டிய பின் வேறு தொலைபேசியால் வெளியிலிருந்து ஸ்கேன் செய்து பகலில் தெளிவாகப் படிக்கிறதா எனப் பாருங்கள்."], ["part", "Part B: bike, luggage and care", "பகுதி B: பைக், பை மற்றும் பராமரிப்பு"], ["h", "4.5", "Your bike", "உங்கள் பைக்"], ["ul", [["Choose a clean, dry, flat surface that is easy to see, such as the side of the fuel tank or under the seat edge.", "எளிதில் தெரியும் சுத்தமான, உலர்ந்த, சமதளமான இடத்தைத் தேர்ந்தெடுங்கள்; எ.கா. எரிபொருள் தொட்டியின் பக்கம் அல்லது இருக்கையின் கீழ் விளிம்பு."], ["Keep it away from the engine, exhaust and other very hot parts.", "எஞ்சின், புகைபோக்கி மற்றும் மிகவும் சூடான பாகங்களிலிருந்து விலக்கி வையுங்கள்."], ["Do not cover or alter the registration plate, or any marking required by law.", "பதிவு எண் தகட்டையோ சட்டப்படி தேவையான எந்த குறியையோ மறைக்கவோ மாற்றவோ வேண்டாம்."], ["Wipe the surface first. Press the sticker from the centre outward to remove air bubbles.", "முதலில் இடத்தைத் துடையுங்கள். காற்றுக் குமிழ் போக ஸ்டிக்கரை நடுவிலிருந்து வெளிப்புறமாக அழுத்துங்கள்."]]], ["h", "4.6", "Your luggage", "உங்கள் பை/பெட்டி"], ["ul", [["**Sticker:** place it on a smooth, hard surface of the bag or case, or inside an outer pocket where it stays dry.", "**ஸ்டிக்கர்:** பை/பெட்டியின் மென்மையான, கடினமான பரப்பில் அல்லது உலர்வாக இருக்கும் வெளிப்புற பாக்கெட்டின் உள்ளே ஒட்டுங்கள்."], ["**Plastic tag:** attach it to the handle or strap so the QR faces out.", "**பிளாஸ்டிக் டேக்:** QR வெளிப்புறம் தெரியும்படி கைப்பிடி அல்லது பட்டையில் இணையுங்கள்."], ["**Acrylic keychain:** attach it to keys, a bag zip or a pouch.", "**அக்ரிலிக் கீசெயின்:** சாவி, பை ஜிப் அல்லது பவுச்சில் இணையுங்கள்."]]], ["h", "4.7", "Other belongings", "மற்ற பொருட்கள்"], ["p", "You may place PingMe stickers on other personal items you want to be reachable about, such as a laptop bag, helmet or camera case. PingMe is meant for belongings and vehicles. Do not use it on, or to track, any person.", "லேப்டாப் பை, ஹெல்மெட், கேமரா பெட்டி போன்ற உங்கள் சொந்த பொருட்களிலும் PingMe ஸ்டிக்கரை ஒட்டலாம். PingMe பொருட்களுக்கும் வாகனங்களுக்கும் மட்டுமே; எந்த நபர் மீதும் பயன்படுத்தவோ ஒருவரைக் கண்காணிக்கவோ கூடாது."], ["h", "4.8", "Care of your QR", "QR பராமரிப்பு"], ["ul", [["Keep the QR clean and undamaged. A scratched or faded code may not scan.", "QR-ஐ சுத்தமாகவும் சேதமில்லாமலும் வையுங்கள். கீறல் அல்லது மங்கிய குறியீடு ஸ்கேன் ஆகாமல் போகலாம்."], ["Check your QR every few months. If it is worn, request a spare sticker (section 8).", "சில மாதங்களுக்கு ஒரு முறை QR-ஐ சரிபாருங்கள். தேய்ந்திருந்தால் மாற்று ஸ்டிக்கர் கேளுங்கள் (பிரிவு 8)."], ["Do not cut, cover, crop or edit the QR or the Customer ID.", "QR அல்லது வாடிக்கையாளர் ஐடியை வெட்டவோ மறைக்கவோ திருத்தவோ வேண்டாம்."], ["Do not photograph and publish your QR online. Anyone with the image could send alerts to you.", "QR-ஐ படம் எடுத்து இணையத்தில் வெளியிடாதீர்கள். அந்தப் படம் வைத்திருக்கும் எவரும் உங்களுக்கு அறிவிப்பு அனுப்ப முடியும்."]]], ["warn", "**Safety.** Never place a PingMe item where it can distract a driver, block a mirror, camera or sensor, or loosen and fall while the vehicle moves. You are responsible for where you place items on your vehicle.", "**பாதுகாப்பு.** ஓட்டுநரின் கவனத்தைத் திசை திருப்பும், கண்ணாடி/கேமரா/சென்சாரை மறைக்கும், அல்லது வாகனம் ஓடும்போது தளர்ந்து விழக்கூடிய இடத்தில் PingMe பொருளை ஒட்டாதீர்கள். வாகனத்தில் எங்கு ஒட்டுகிறீர்கள் என்பது உங்கள் பொறுப்பு."], ["note", "**Test it:** scan each QR you place with a different phone to confirm it opens the PingMe page.", "**சோதியுங்கள்:** ஒட்டிய ஒவ்வொரு QR-ஐயும் வேறு தொலைபேசியால் ஸ்கேன் செய்து PingMe பக்கம் திறக்கிறதா எனப் பாருங்கள்."]]}, {"n": 5, "t": ["Your online account", "உங்கள் ஆன்லைன் கணக்கு"], "sub": null, "cont": false, "blocks": [["h", "5.1", "Signing in", "உள்நுழைதல்"], ["ol", [["Go to pingmeconnect.in/account.", "pingmeconnect.in/account-க்குச் செல்லுங்கள்."], ["Enter your registered mobile number or email and your password.", "பதிவு செய்த மொபைல் எண் அல்லது மின்னஞ்சல் மற்றும் கடவுச்சொல்லை உள்ளிடுங்கள்."], ["Tap Sign in. Your account opens on a simple home screen.", "Sign in அழுத்துங்கள். எளிய முகப்புத் திரையில் உங்கள் கணக்கு திறக்கும்."]]], ["h", "5.2", "What you can do", "நீங்கள் செய்யக்கூடியவை"], ["tbl", null, [[["My QR code", "எனது QR குறியீடு"], ["Download or print your QR", "QR-ஐ பதிவிறக்க அல்லது அச்சிட"]], [["Alert numbers", "அறிவிப்பு எண்கள்"], ["Add a second person", "இரண்டாவது நபரைச் சேர்க்க"]], [["My profile", "எனது சுயவிவரம்"], ["Name, photo, address", "பெயர், புகைப்படம், முகவரி"]], [["Credits and plan", "கிரெடிட் மற்றும் திட்டம்"], ["Balance and validity", "இருப்பு மற்றும் செல்லுபடி"]], [["Password", "கடவுச்சொல்"], ["Change your password", "கடவுச்சொல்லை மாற்ற"]], [["Help and support", "உதவி மற்றும் ஆதரவு"], ["Contact and policies", "தொடர்பு மற்றும் கொள்கைகள்"]]]], ["h", "5.3", "If you forget your password", "கடவுச்சொல்லை மறந்தால்"], ["ol", [["On the sign-in page, tap Forgot your password?", "உள்நுழைவு பக்கத்தில் Forgot your password? அழுத்துங்கள்."], ["Enter the email registered on your account. A reset link is sent to that email.", "கணக்கில் பதிவான மின்னஞ்சலை உள்ளிடுங்கள். அந்த மின்னஞ்சலுக்கு மாற்றும் இணைப்பு அனுப்பப்படும்."], ["Open the link and choose a new password.", "இணைப்பைத் திறந்து புதிய கடவுச்சொல்லைத் தேர்ந்தெடுங்கள்."]]], ["p", "If no email is registered on your account, message support on WhatsApp with your Customer ID. We will verify you and help you regain access.", "கணக்கில் மின்னஞ்சல் பதிவாகவில்லை என்றால், வாடிக்கையாளர் ஐடியுடன் WhatsApp-ல் ஆதரவுக்குச் செய்தி அனுப்புங்கள். உங்களைச் சரிபார்த்து மீண்டும் அணுக உதவுவோம்."], ["h", "5.4", "Sign-in protection", "உள்நுழைவு பாதுகாப்பு"], ["p", "To protect your account, five wrong password attempts lock sign-in for 15 minutes. Wait for the lock to end, then try again with the correct password. This also stops other people from guessing your password.", "உங்கள் கணக்கைப் பாதுகாக்க, ஐந்து முறை தவறான கடவுச்சொல் உள்ளிட்டால் 15 நிமிடம் உள்நுழைவு பூட்டப்படும். பூட்டு முடியும் வரை காத்திருந்து சரியான கடவுச்சொல்லுடன் மீண்டும் முயலுங்கள். இது மற்றவர்கள் கடவுச்சொல்லை ஊகிப்பதையும் தடுக்கும்."], ["h", "5.5", "Keeping your account safe", "கணக்கைப் பாதுகாப்பாக வைத்தல்"], ["ul", [["Choose a password you do not use anywhere else, and do not share it.", "வேறு எங்கும் பயன்படுத்தாத கடவுச்சொல்லைத் தேர்ந்தெடுங்கள்; யாருடனும் பகிராதீர்கள்."], ["Sign out when you use a shared phone or computer.", "பொதுவான தொலைபேசி/கணினியில் பயன்படுத்தினால் வெளியேறுங்கள் (Sign out)."], ["Keep your registered mobile number and email up to date.", "பதிவு செய்த மொபைல் எண் மற்றும் மின்னஞ்சலை புதுப்பித்து வையுங்கள்."]]], ["warn", "PingMe will never ask you for your password or a 6-digit code on a call, SMS or WhatsApp chat. Do not share them with anyone, including people who say they are from PingMe.", "PingMe அழைப்பு, SMS அல்லது WhatsApp உரையாடலில் உங்கள் கடவுச்சொல்லையோ 6 இலக்க குறியீட்டையோ ஒருபோதும் கேட்காது. PingMe-ல் இருந்து வருவதாகக் கூறுவோர் உட்பட யாருடனும் பகிராதீர்கள்."]]}, {"n": 6, "t": ["Alert numbers", "அறிவிப்பு எண்கள்"], "sub": null, "cont": false, "blocks": [["h", "6.1", "Who receives your alerts", "அறிவிப்புகளைப் பெறுவோர்"], ["tbl", null, [[["Primary WhatsApp", "முதன்மை WhatsApp"], ["The number you registered. Alerts always reach it. Changing it is done through support for your security.", "நீங்கள் பதிவு செய்த எண். அறிவிப்புகள் எப்போதும் இதற்கு வரும். பாதுகாப்புக்காக இதை மாற்றுவது ஆதரவு வழியாக மட்டுமே."]], [["Second number", "இரண்டாவது எண்"], ["Optional. A family member or colleague who also receives your alerts.", "விருப்பத்திற்குரியது. உங்கள் அறிவிப்புகளைப் பெறும் குடும்ப உறுப்பினர் அல்லது சக ஊழியர்."]], [["Alert email", "அறிவிப்பு மின்னஞ்சல்"], ["Optional. Alerts can also be sent to an email, and you can switch this on or off.", "விருப்பத்திற்குரியது. அறிவிப்புகளை மின்னஞ்சலுக்கும் அனுப்பலாம்; இதை இயக்கவோ நிறுத்தவோ முடியும்."]]]], ["h", "6.2", "Add a second number", "இரண்டாவது எண்ணைச் சேர்த்தல்"], ["ol", [["Sign in at pingmeconnect.in/account and open Alert numbers.", "pingmeconnect.in/account-ல் உள்நுழைந்து Alert numbers-ஐத் திறவுங்கள்."], ["Type the second person's name and their WhatsApp number, then tap add.", "இரண்டாவது நபரின் பெயர் மற்றும் WhatsApp எண்ணை உள்ளிட்டு add அழுத்துங்கள்."], ["Ask that person to open WhatsApp and send JOIN followed by your Customer ID, for example JOIN PM-7K3QX9AB, to +91 91500 47587. They must send it from the number you added.", "அவரை WhatsApp-ல் JOIN என எழுதி உங்கள் வாடிக்கையாளர் ஐடியுடன், எ.கா. JOIN PM-7K3QX9AB, +91 91500 47587 எண்ணுக்கு அனுப்பச் சொல்லுங்கள். நீங்கள் சேர்த்த எண்ணிலிருந்தே அனுப்ப வேண்டும்."], ["They receive a 6-digit code on WhatsApp. Enter that code in your account.", "அவருக்கு WhatsApp-ல் 6 இலக்க குறியீடு வரும். அதை உங்கள் கணக்கில் உள்ளிடுங்கள்."], ["The number shows as verified. Alerts now reach both of you.", "எண் சரிபார்க்கப்பட்டதாகக் காட்டும். இனி இருவருக்கும் அறிவிப்பு வரும்."]]], ["h", "6.3", "Rules to know", "அறிய வேண்டிய விதிகள்"], ["ul", [["**One number, one account.** A mobile number can be linked to only one PingMe account at a time, as the primary or as a second number.", "**ஒரு எண், ஒரு கணக்கு.** ஒரு மொபைல் எண் ஒரு நேரத்தில் ஒரே PingMe கணக்குடன் மட்டுமே (முதன்மையாகவோ இரண்டாவதாகவோ) இணைக்கப்படலாம்."], ["**The second person must agree.** The JOIN message is their consent to receive your alerts.", "**இரண்டாவது நபர் ஒப்புக்கொள்ள வேண்டும்.** JOIN செய்தி, உங்கள் அறிவிப்புகளைப் பெற அவரது சம்மதமாகும்."], ["You remain responsible for the person you add (see section 9).", "நீங்கள் சேர்க்கும் நபருக்கு நீங்களே பொறுப்பு (பிரிவு 9-ஐப் பாருங்கள்)."]]], ["h", "6.4", "Change a name or remove the number", "பெயர் மாற்றுதல் அல்லது எண்ணை நீக்குதல்"], ["ul", [["To correct the second person's name, edit it in Alert numbers.", "இரண்டாவது நபரின் பெயரைத் திருத்த, Alert numbers-ல் மாற்றுங்கள்."], ["To remove the second number, remove it in the same screen. Alerts then go to your primary number only.", "இரண்டாவது எண்ணை நீக்க, அதே திரையில் நீக்குங்கள். பின் அறிவிப்புகள் முதன்மை எண்ணுக்கு மட்டும் செல்லும்."], ["To change who receives alerts, you can also switch the second number or the email on or off, then save.", "யார் பெறுவது என்பதை மாற்ற, இரண்டாவது எண் அல்லது மின்னஞ்சலை இயக்கி/நிறுத்தி சேமிக்கலாம்."]]], ["note", "**Tip:** ask the second person to save +91 91500 47587 as \"PingMe\" so they recognise alerts.", "**குறிப்பு:** அறிவிப்புகளை அடையாளம் காண இரண்டாவது நபரும் +91 91500 47587-ஐ “PingMe” என்று சேமிக்கச் சொல்லுங்கள்."]]}, {"n": 7, "t": ["Alerts, credits and renewal", "அறிவிப்புகள், கிரெடிட் மற்றும் புதுப்பிப்பு"], "sub": null, "cont": false, "blocks": [["h", "7.1", "How credits work", "கிரெடிட் எப்படி வேலை செய்கிறது"], ["tbl", ["Event", "Credit used"], [[["Someone scans or opens your QR page", "யாராவது உங்கள் QR பக்கத்தை ஸ்கேன் செய்தாலோ திறந்தாலோ"], ["None", "இல்லை"]], [["An alert is delivered to you on WhatsApp", "உங்களுக்கு WhatsApp-ல் அறிவிப்பு வந்து சேர்ந்தால்"], ["1 credit", "1 கிரெடிட்"]], [["WhatsApp does not accept the alert", "WhatsApp அறிவிப்பை ஏற்கவில்லை என்றால்"], ["None. No credit is deducted", "இல்லை. கிரெடிட் குறைக்கப்படாது"]], [["Your reply to the person who scanned", "ஸ்கேன் செய்தவருக்கு நீங்கள் அனுப்பும் பதில்"], ["None", "இல்லை"]]]], ["h", "7.2", "Your credits on activation", "செயல்படுத்தும்போது உங்கள் கிரெடிட்"], ["p", "Your kit includes 250 alerts. They are added to your account when you activate. Your balance is shown under Credits and plan in your account.", "உங்கள் கிட்டில் 250 அறிவிப்புகள் உள்ளன. செயல்படுத்தும்போது அவை உங்கள் கணக்கில் சேர்க்கப்படும். இருப்பை கணக்கில் Credits and plan பகுதியில் காணலாம்."], ["h", "7.3", "Recharge when credits run low", "கிரெடிட் குறைந்தால் ரீசார்ஜ்"], ["ul", [["Message support on WhatsApp at +91 98405 47587 with your Customer ID and the pack you want.", "வாடிக்கையாளர் ஐடி மற்றும் தேவையான பேக் விவரத்துடன் +91 98405 47587 என்ற எண்ணில் WhatsApp-ல் ஆதரவுக்குச் செய்தி அனுப்புங்கள்."], ["Current recharge packs and prices are listed on pingmeconnect.in and are confirmed by support before you pay.", "தற்போதைய ரீசார்ஜ் பேக்குகள் மற்றும் விலைகள் pingmeconnect.in-ல் உள்ளன; பணம் செலுத்தும் முன் ஆதரவு உறுதிப்படுத்தும்."], ["Credits are added to your account after your payment is verified.", "பணம் சரிபார்க்கப்பட்ட பின் கிரெடிட் உங்கள் கணக்கில் சேர்க்கப்படும்."]]], ["p", "Details are in the Credits Policy at pingmeconnect.in/legal/credits-policy.html", "விவரங்கள்: pingmeconnect.in/legal/credits-policy.html-ல் உள்ள கிரெடிட் கொள்கை."], ["h", "7.4", "Your yearly service plan", "உங்கள் ஆண்டு சேவைத் திட்டம்"], ["ul", [["Your plan runs for 1 year from the day you activate. The end date is shown in your account.", "நீங்கள் செயல்படுத்திய நாளிலிருந்து திட்டம் 1 ஆண்டு செல்லும். முடிவு தேதி உங்கள் கணக்கில் காட்டப்படும்."], ["To renew, message support or use the renewal option when it is shown on pingmeconnect.in.", "புதுப்பிக்க, ஆதரவுக்குச் செய்தி அனுப்புங்கள் அல்லது pingmeconnect.in-ல் காட்டப்படும் புதுப்பிப்பு வசதியைப் பயன்படுத்துங்கள்."], ["The renewal price is shown to you before you pay.", "பணம் செலுத்தும் முன் புதுப்பிப்புக் கட்டணம் உங்களுக்குக் காட்டப்படும்."], ["There is no automatic renewal. We do not charge you again unless you choose to renew.", "தானியங்கி புதுப்பிப்பு இல்லை. நீங்கள் தேர்ந்தெடுக்காமல் மீண்டும் கட்டணம் வசூலிக்க மாட்டோம்."]]], ["h", "7.5", "Keep your plan running", "திட்டம் தொடர்ந்து இயங்க"], ["p", "Renew before your plan end date so your QR keeps alerting you without a break. If you are unsure of your date or balance, sign in to your account or ask support.", "இடைவெளியின்றி QR அறிவிப்பு அனுப்ப, திட்ட முடிவு தேதிக்கு முன் புதுப்பியுங்கள். தேதி அல்லது இருப்பு தெரியாவிட்டால் கணக்கில் உள்நுழையுங்கள் அல்லது ஆதரவைக் கேளுங்கள்."], ["note", "**Good to know:** prices and packs can change. The price shown to you at the time of purchase or renewal is the price that applies to that purchase.", "**அறிந்து கொள்ளுங்கள்:** விலைகளும் பேக்குகளும் மாறலாம். கொள்முதல் அல்லது புதுப்பிப்பின் போது உங்களுக்குக் காட்டப்பட்ட விலையே அந்த கொள்முதலுக்குப் பொருந்தும்."]]}, {"n": 8, "t": ["Lost, damaged or changed", "தொலைந்தால், சேதமடைந்தால் அல்லது மாறினால்"], "sub": null, "cont": false, "blocks": [["h", "8.1", "A sticker is worn, damaged or lost", "ஸ்டிக்கர் தேய்ந்தால், சேதமடைந்தால் அல்லது தொலைந்தால்"], ["ul", [["Message support on WhatsApp at +91 98405 47587 with your Customer ID and, if you can, a photo of the damage.", "வாடிக்கையாளர் ஐடி மற்றும் முடிந்தால் சேதத்தின் புகைப்படத்துடன் +91 98405 47587-ல் WhatsApp-ல் ஆதரவுக்குச் செய்தி அனுப்புங்கள்."], ["We can send spare QR stickers. Ask support for the current price.", "மாற்று QR ஸ்டிக்கர்களை அனுப்ப முடியும். தற்போதைய விலையை ஆதரவிடம் கேளுங்கள்."], ["Spare stickers carry their own code and are linked to your account when we send them.", "மாற்று ஸ்டிக்கர்களுக்கு தனி குறியீடு இருக்கும்; அனுப்பும்போது அவை உங்கள் கணக்குடன் இணைக்கப்படும்."], ["Fit the new sticker on your PVC card or surface in the same way as before (section 4).", "புதிய ஸ்டிக்கரை முன்பு போலவே PVC கார்டு அல்லது பரப்பில் ஒட்டுங்கள் (பிரிவு 4)."]]], ["h", "8.2", "You lose a sticker, card or the whole kit", "ஸ்டிக்கர், கார்டு அல்லது முழு கிட்டும் தொலைந்தால்"], ["ul", [["Tell support quickly, with your Customer ID. We can switch off a lost code so it stops working.", "வாடிக்கையாளர் ஐடியுடன் உடனே ஆதரவிடம் தெரிவியுங்கள். தொலைந்த குறியீட்டை செயலிழக்கச் செய்து நிறுத்த முடியும்."], ["Your account and remaining credits are not affected.", "உங்கள் கணக்கும் மீதமுள்ள கிரெடிட்டும் பாதிக்கப்படாது."], ["Switching off a code is not possible for your main kit code, so report a lost main kit to support, who will advise you.", "முதன்மை கிட் குறியீட்டை செயலிழக்கச் செய்ய முடியாது; எனவே முதன்மை கிட் தொலைந்தால் ஆதரவிடம் தெரிவியுங்கள், அவர்கள் வழிகாட்டுவர்."]]], ["h", "8.3", "An item is missing or damaged on delivery", "டெலிவரியில் பொருள் குறைந்தால் அல்லது சேதமடைந்தால்"], ["p", "Contact support as soon as you open the box. Send photos of the box and the item. We will arrange a replacement or refund as set out in the Refund Policy at pingmeconnect.in/legal/refund-policy.html. Keep the box until the matter is resolved.", "பெட்டியைத் திறந்தவுடன் ஆதரவைத் தொடர்பு கொள்ளுங்கள். பெட்டி மற்றும் பொருளின் புகைப்படங்களை அனுப்புங்கள். pingmeconnect.in/legal/refund-policy.html-ல் உள்ள பணத் திரும்பப் பெறல் கொள்கைப்படி மாற்று அல்லது பணத் திரும்பலை ஏற்பாடு செய்வோம். பிரச்சனை தீரும் வரை பெட்டியை வைத்திருங்கள்."], ["h", "8.4", "Change your phone number, email or address", "தொலைபேசி எண், மின்னஞ்சல் அல்லது முகவரி மாற்றுதல்"], ["ul", [["You can update your name, photo and address yourself in your account (My profile).", "பெயர், புகைப்படம், முகவரியை நீங்களே கணக்கில் (My profile) புதுப்பிக்கலாம்."], ["To change your registered WhatsApp number, ask support. We verify you first so that nobody else can take over your account.", "பதிவு செய்த WhatsApp எண்ணை மாற்ற ஆதரவைக் கேளுங்கள். வேறு யாரும் உங்கள் கணக்கை எடுத்துக்கொள்ளாமல் இருக்க முதலில் உங்களைச் சரிபார்ப்போம்."]]], ["h", "8.5", "You sell your vehicle or give away an item", "வாகனத்தை விற்றால் அல்லது பொருளைக் கொடுத்தால்"], ["ul", [["Remove or cover the QR on the item before it leaves your hands, so alerts do not reach you for someone else's use.", "பொருள் உங்கள் கையை விட்டுப் போகும் முன் QR-ஐ அகற்றவோ மூடவோ செய்யுங்கள்; மற்றவரின் பயன்பாட்டுக்கான அறிவிப்புகள் உங்களுக்கு வராமல் இருக்கும்."], ["Ask support to update or close your account if you no longer want the service.", "சேவை வேண்டாம் என்றால் கணக்கைப் புதுப்பிக்க அல்லது மூட ஆதரவைக் கேளுங்கள்."]]], ["h", "8.6", "What to send support", "ஆதரவுக்கு அனுப்ப வேண்டியவை"], ["ol", [["Your Customer ID", "உங்கள் வாடிக்கையாளர் ஐடி"], ["The WhatsApp number registered on your account", "கணக்கில் பதிவான WhatsApp எண்"], ["What happened, in one or two lines", "என்ன நடந்தது என்பதை ஒன்று அல்லது இரண்டு வரிகளில்"], ["A photo, if the problem is a damaged or missing item", "சேதமடைந்த/குறைந்த பொருள் என்றால் ஒரு புகைப்படம்"]]]]}, {"n": 9, "t": ["Responsible use and your agreement", "பொறுப்பான பயன்பாடு மற்றும் உங்கள் ஒப்பந்தம்"], "sub": null, "cont": false, "blocks": [["h", "9.1", "Why this matters", "இது ஏன் முக்கியம்"], ["p", "PingMe lets strangers send a message to an owner. To keep it safe for everyone, each customer accepts the **Genuine Use Declaration** when activating. In short, you agree that:", "PingMe மூலம் அந்நியர்கள் உரிமையாளருக்குச் செய்தி அனுப்பலாம். அனைவருக்கும் பாதுகாப்பாக இருக்க, ஒவ்வொரு வாடிக்கையாளரும் செயல்படுத்தும்போது **உண்மையான பயன்பாட்டு உறுதிமொழியை** ஏற்கிறார். சுருக்கமாக, நீங்கள் ஒப்புக்கொள்வது:"], ["h", "9.2", "The eight commitments", "எட்டு உறுதிமொழிகள்"], ["ol", [["**Genuine purpose.** You use PingMe only to be contacted about your own vehicle, luggage or belongings.", "**உண்மையான நோக்கம்.** உங்கள் சொந்த வாகனம், பை அல்லது பொருட்கள் தொடர்பாகத் தொடர்பு கொள்ளப்பட மட்டுமே PingMe-ஐப் பயன்படுத்துவீர்கள்."], ["**No misuse.** You will not use PingMe to harass, threaten, stalk, defame, scam, impersonate or track anyone without consent, or to break any law.", "**தவறான பயன்பாடு கூடாது.** துன்புறுத்த, மிரட்ட, பின்தொடர, அவதூறு பரப்ப, மோசடி செய்ய, ஆள்மாறாட்டம் செய்ய, சம்மதமின்றி யாரையும் கண்காணிக்க அல்லது எந்த சட்டத்தையும் மீற PingMe-ஐப் பயன்படுத்த மாட்டீர்கள்."], ["**Your responsibility.** You are responsible for how you and anyone you allow, such as a second number, use your kit and account. Your details are true.", "**உங்கள் பொறுப்பு.** நீங்களும், இரண்டாவது எண் போன்று நீங்கள் அனுமதிப்பவரும் கிட் மற்றும் கணக்கை எவ்வாறு பயன்படுத்துகிறீர்கள் என்பதற்கு நீங்களே பொறுப்பு. உங்கள் விவரங்கள் உண்மையானவை."], ["**Responsibility of PingMe.** To the extent the law allows, PingMe and Bharani Innovations are not responsible for misuse by you or by anyone you allow. PingMe only forwards messages and is not an emergency, police, medical or rescue service.", "**PingMe-ன் பொறுப்பு.** சட்டம் அனுமதிக்கும் அளவுக்கு, நீங்கள் அல்லது நீங்கள் அனுமதிப்பவர் செய்யும் தவறான பயன்பாட்டுக்கு PingMe மற்றும் Bharani Innovations பொறுப்பல்ல. PingMe செய்திகளை அனுப்பி வைக்க மட்டுமே; அது அவசரகால, காவல், மருத்துவ அல்லது மீட்புச் சேவை அல்ல."], ["**Suspension.** We may suspend or deactivate a QR or account if misuse is suspected, as set out in the Terms of Use.", "**நிறுத்தம்.** தவறான பயன்பாடு சந்தேகிக்கப்பட்டால், பயன்பாட்டு விதிமுறைகளின்படி QR அல்லது கணக்கை நிறுத்தவோ செயலிழக்கவோ செய்யலாம்."], ["**Sharing with authorities.** We may share your registered details and related records with the police, a court or another authority on a lawful written request or where the law requires.", "**அதிகாரிகளுடன் பகிர்தல்.** சட்டப்படியான எழுத்துப்பூர்வ கோரிக்கையின் பேரில் அல்லது சட்டம் கோரும்போது, உங்கள் பதிவு விவரங்களையும் தொடர்புடைய பதிவுகளையும் காவல்துறை, நீதிமன்றம் அல்லது பிற அதிகாரியுடன் பகிரலாம்."], ["**Record of agreement.** We keep proof of your acceptance: date and time, text version, IP address and device details.", "**ஒப்பந்தப் பதிவு.** உங்கள் ஏற்பின் ஆதாரத்தை வைத்திருப்போம்: தேதி, நேரம், உரைப் பதிப்பு, IP முகவரி மற்றும் சாதன விவரம்."], ["**Terms and Privacy.** You have read the Terms of Use and Privacy Policy. Nothing here reduces your rights under Indian consumer law.", "**விதிமுறைகள் மற்றும் தனியுரிமை.** பயன்பாட்டு விதிமுறைகள் மற்றும் தனியுரிமைக் கொள்கையைப் படித்துள்ளீர்கள். இந்திய நுகர்வோர் சட்டத்தின் கீழ் உங்கள் உரிமைகளை இது குறைக்காது."]]], ["h", "9.3", "What counts as misuse", "எவை தவறான பயன்பாடு"], ["ul", [["Sending threatening, abusive or repeated unwanted messages through PingMe.", "PingMe வழியாக மிரட்டல், அவதூறு அல்லது தேவையற்ற மீண்டும் மீண்டும் செய்திகள் அனுப்புதல்."], ["Placing PingMe on a person, or using it to follow someone.", "ஒரு நபர் மீது PingMe-ஐ வைப்பது அல்லது ஒருவரைப் பின்தொடரப் பயன்படுத்துவது."], ["Using another person's number or details without their permission.", "மற்றவரின் எண் அல்லது விவரங்களை அனுமதியின்றிப் பயன்படுத்துவது."]]], ["warn", "**If PingMe is misused,** we may suspend your QR codes or account and, on a lawful written request, hand your records to the authorities.", "**PingMe தவறாகப் பயன்படுத்தப்பட்டால்,** உங்கள் QR குறியீடுகள் அல்லது கணக்கை நிறுத்தவும், சட்டப்படியான எழுத்துப்பூர்வ கோரிக்கையின் பேரில் உங்கள் பதிவுகளை அதிகாரிகளிடம் ஒப்படைக்கவும் கூடும்."], ["p", "The full text is at **pingmeconnect.in/legal/genuine-use.html**. Please keep a copy of what you accepted by saving that page.", "முழு உரை **pingmeconnect.in/legal/genuine-use.html**-ல் உள்ளது. நீங்கள் ஏற்றதன் நகலாக அந்தப் பக்கத்தைச் சேமித்து வையுங்கள்."]]}, {"n": 10, "t": ["Privacy and your data", "தனியுரிமை மற்றும் உங்கள் தரவு"], "sub": null, "cont": false, "blocks": [["h", "10.1", "Who is responsible for your data", "உங்கள் தரவுக்குப் பொறுப்பானவர்"], ["p", "**Bharani Innovations**, Madambakkam, Chennai 600 126, operates PingMe and decides how your personal data is used.", "**Bharani Innovations**, மடம்பாக்கம், சென்னை 600 126, PingMe-ஐ நடத்துகிறது; உங்கள் தனிப்பட்ட தரவு எவ்வாறு பயன்படுத்தப்படும் என்பதையும் தீர்மானிக்கிறது."], ["h", "10.2", "What we keep and why", "நாங்கள் எதை வைத்திருக்கிறோம், ஏன்"], ["tbl", ["Information", "Why we need it"], [[["Name, mobile number, email, address", "பெயர், மொபைல் எண், மின்னஞ்சல், முகவரி"], ["To register you, deliver your kit, send alerts and support you", "உங்களைப் பதிவு செய்ய, கிட்டை அனுப்ப, அறிவிப்புகள் அனுப்ப மற்றும் ஆதரவளிக்க"]], [["Customer ID and account details", "வாடிக்கையாளர் ஐடி மற்றும் கணக்கு விவரம்"], ["To run your account and link your QR to you", "கணக்கை நடத்தவும் QR-ஐ உங்களுடன் இணைக்கவும்"]], [["Profile photo (optional)", "சுயவிவரப் புகைப்படம் (விருப்பம்)"], ["To show on your account, only if you add it", "நீங்கள் சேர்த்தால் மட்டும் கணக்கில் காட்ட"]], [["Alert details: reason, time, and any photo or location the scanner chose to send", "அறிவிப்பு விவரம்: காரணம், நேரம், ஸ்கேன் செய்பவர் அனுப்பிய புகைப்படம்/இருப்பிடம்"], ["To deliver the alert to you and keep a history", "அறிவிப்பை உங்களுக்கு சேர்க்கவும் வரலாற்றை வைத்திருக்கவும்"]], [["Message delivery and credit records", "செய்தி டெலிவரி மற்றும் கிரெடிட் பதிவுகள்"], ["To confirm delivery and keep your balance correct", "டெலிவரியை உறுதிப்படுத்தவும் இருப்பைச் சரியாக வைக்கவும்"]], [["Agreement record with IP address and device", "IP முகவரி மற்றும் சாதனத்துடன் ஒப்பந்தப் பதிவு"], ["To keep proof that you accepted the declaration", "நீங்கள் உறுதிமொழியை ஏற்றதற்கான ஆதாரம் வைக்க"]], [["Sign-in and security records", "உள்நுழைவு மற்றும் பாதுகாப்புப் பதிவுகள்"], ["To protect your account from misuse", "கணக்கைத் தவறான பயன்பாட்டிலிருந்து பாதுகாக்க"]]]], ["h", "10.3", "Who else handles your data", "வேறு யார் உங்கள் தரவைக் கையாள்கிறார்கள்"], ["ul", [["Service providers who process data for us: **Cloudflare** (hosting), **Supabase** (database), **Meta WhatsApp** (messages), **Resend** (email) and our courier.", "எங்களுக்காகத் தரவைச் செயலாக்கும் சேவை வழங்குநர்கள்: **Cloudflare** (ஹோஸ்டிங்), **Supabase** (தரவுத்தளம்), **Meta WhatsApp** (செய்திகள்), **Resend** (மின்னஞ்சல்) மற்றும் எங்கள் கூரியர்."], ["The police, a court or another authority, **only** on a lawful written request or where the law requires.", "காவல்துறை, நீதிமன்றம் அல்லது பிற அதிகாரி — சட்டப்படியான எழுத்துப்பூர்வ கோரிக்கையின் பேரில் அல்லது சட்டம் கோரும்போது **மட்டும்**."], ["We do not sell your personal data.", "உங்கள் தனிப்பட்ட தரவை நாங்கள் விற்பதில்லை."]]], ["h", "10.4", "How long we keep it", "எவ்வளவு காலம் வைத்திருக்கிறோம்"], ["p", "We keep your data while your account is active and for as long as needed for the service, accounts, legal claims and law. Agreement records are kept longer so we can prove what was accepted. The Privacy Notice explains the periods.", "உங்கள் கணக்கு செயலில் இருக்கும் வரையிலும், சேவை, கணக்கு, சட்டக் கோரிக்கைகள் மற்றும் சட்டத்திற்குத் தேவையான வரையிலும் தரவை வைத்திருப்போம். எது ஏற்கப்பட்டது என நிரூபிக்க ஒப்பந்தப் பதிவுகள் நீண்ட காலம் வைக்கப்படும். காலங்கள் தனியுரிமை அறிவிப்பில் உள்ளன."], ["h", "10.5", "Your choices and rights", "உங்கள் தேர்வுகள் மற்றும் உரிமைகள்"], ["ul", [["See and correct your details in your account, or ask support.", "கணக்கில் உங்கள் விவரங்களைப் பார்த்துத் திருத்தலாம் அல்லது ஆதரவைக் கேட்கலாம்."], ["Ask us to delete data we no longer need. Some records must be kept by law.", "தேவையற்ற தரவை நீக்கச் சொல்லலாம். சில பதிவுகளைச் சட்டப்படி வைத்திருக்க வேண்டும்."], ["Withdraw your consent where it applies, or raise a concern with us.", "பொருந்தும் இடத்தில் சம்மதத்தைத் திரும்பப் பெறலாம் அல்லது கவலையைத் தெரிவிக்கலாம்."], ["Write to support on WhatsApp **+91 98405 47587**. We reply within a reasonable time.", "**+91 98405 47587** என்ற WhatsApp எண்ணில் ஆதரவுக்கு எழுதுங்கள். நியாயமான நேரத்தில் பதிலளிப்போம்."]]], ["note", "Full details are in the Privacy Notice at **pingmeconnect.in/legal/privacy.html**.", "முழு விவரங்கள் **pingmeconnect.in/legal/privacy.html**-ல் உள்ள தனியுரிமை அறிவிப்பில் உள்ளன."]]}, {"n": 11, "t": ["Limits, safety and your rights", "வரம்புகள், பாதுகாப்பு மற்றும் உங்கள் உரிமைகள்"], "sub": null, "cont": false, "blocks": [["h", "11.1", "PingMe is not an emergency service", "PingMe அவசரகாலச் சேவை அல்ல"], ["warn", "**In an emergency, call 112.** PingMe forwards messages for convenience. It is not a police, medical, fire, rescue or security service, and it cannot guarantee that anyone will respond.", "**அவசரநிலையில் 112-ஐ அழைக்கவும்.** PingMe வசதிக்காக செய்திகளை அனுப்புகிறது. இது காவல், மருத்துவ, தீயணைப்பு, மீட்பு அல்லது பாதுகாப்புச் சேவை அல்ல; யாரும் பதிலளிப்பர் என்று உறுதி அளிக்க இயலாது."], ["h", "11.2", "What can affect alerts", "அறிவிப்புகளைப் பாதிக்கக்கூடியவை"], ["p", "An alert depends on services outside our control. It may be delayed or not delivered if:", "அறிவிப்பு எங்கள் கட்டுப்பாட்டுக்கு வெளியே உள்ள சேவைகளைச் சார்ந்தது. பின்வருபவை இருந்தால் தாமதமாகலாம் அல்லது வராமல் போகலாம்:"], ["ul", [["the person scanning has no internet or leaves the page before sending;", "ஸ்கேன் செய்பவருக்கு இணையம் இல்லை அல்லது அனுப்பும் முன் பக்கத்தை விட்டுச் சென்றால்;"], ["your phone is off, has no internet, or WhatsApp is not working;", "உங்கள் தொலைபேசி அணைந்திருந்தால், இணையம் இல்லையெனில் அல்லது WhatsApp வேலை செய்யவில்லை என்றால்;"], ["your credits have finished or your plan has ended;", "கிரெடிட் தீர்ந்தால் அல்லது திட்டம் முடிந்தால்;"], ["the QR is damaged and cannot be scanned;", "QR சேதமடைந்து ஸ்கேன் ஆகவில்லை என்றால்;"], ["WhatsApp or another third-party service has an outage or applies its own rules.", "WhatsApp அல்லது பிற மூன்றாம் தரப்புச் சேவையில் தடை ஏற்பட்டாலோ அவற்றின் சொந்த விதிகள் பொருந்தினாலோ."]]], ["h", "11.3", "Use your own judgement", "உங்கள் சொந்த விவேகத்தைப் பயன்படுத்துங்கள்"], ["ul", [["You decide whether to reply to an alert and what to share. Do not share your number, address or other private details unless you are comfortable.", "அறிவிப்புக்குப் பதிலளிப்பதும் எதைப் பகிர்வதும் உங்கள் முடிவு. நம்பிக்கை இல்லாவிட்டால் உங்கள் எண், முகவரி அல்லது தனிப்பட்ட விவரங்களைப் பகிராதீர்கள்."], ["Meet strangers only in a safe, public place, and never alone at night to collect an item.", "அந்நியரை பாதுகாப்பான பொது இடத்தில் மட்டும் சந்தியுங்கள்; பொருளை வாங்க இரவில் தனியாகச் செல்லாதீர்கள்."], ["Report abusive or threatening messages to us and, where needed, to the police.", "அவதூறு அல்லது மிரட்டல் செய்திகளை எங்களுக்கும், தேவைப்பட்டால் காவல்துறைக்கும் தெரிவியுங்கள்."]]], ["h", "11.4", "Care of the product", "பொருளின் பராமரிப்பு"], ["p", "Stickers, cards and holders are made for everyday use. Extreme heat, constant rain, scratching and strong cleaners can wear them. Replace worn items (section 8).", "ஸ்டிக்கர், கார்டு, ஹோல்டர் ஆகியவை தினசரி பயன்பாட்டிற்கானவை. கடும் வெப்பம், தொடர் மழை, கீறல், வலுவான சுத்திகரிப்பான்கள் அவற்றைத் தேய்மானம் செய்யலாம். தேய்ந்தவற்றை மாற்றுங்கள் (பிரிவு 8)."], ["h", "11.5", "Your consumer rights", "உங்கள் நுகர்வோர் உரிமைகள்"], ["ul", [["Your rights under the **Consumer Protection Act, 2019** and other Indian laws continue to apply. Nothing in this guide takes them away.", "**நுகர்வோர் பாதுகாப்புச் சட்டம், 2019** மற்றும் பிற இந்தியச் சட்டங்களின் கீழ் உங்கள் உரிமைகள் தொடர்ந்து பொருந்தும். இந்த வழிகாட்டியில் எதுவும் அவற்றைப் பறிக்காது."], ["Refunds, replacements and delivery are covered by our Refund Policy and Shipping Policy at **pingmeconnect.in/legal**.", "பணத் திரும்பல், மாற்று மற்றும் டெலிவரி **pingmeconnect.in/legal**-ல் உள்ள பணத் திரும்பல் மற்றும் ஷிப்பிங் கொள்கைகளில் விளக்கப்பட்டுள்ளன."], ["If we cannot resolve a complaint, you may approach the consumer forum with jurisdiction. See section 13 for how to contact us first.", "புகாரைத் தீர்க்க இயலாவிட்டால், அதிகாரம் உள்ள நுகர்வோர் மன்றத்தை அணுகலாம். முதலில் எங்களைத் தொடர்பு கொள்ள பிரிவு 13-ஐப் பாருங்கள்."]]], ["note", "**In summary:** PingMe makes it easy for people to reach you. It works best when your phone, your credits and your QR are in good order.", "**சுருக்கமாக:** மக்கள் உங்களை எளிதில் தொடர்பு கொள்ள PingMe உதவுகிறது. உங்கள் தொலைபேசி, கிரெடிட் மற்றும் QR நல்ல நிலையில் இருந்தால் சிறப்பாக வேலை செய்யும்."]]}, {"n": 12, "t": ["Troubleshooting", "சிக்கல் தீர்வு"], "sub": null, "cont": false, "blocks": [["p", "Find your problem in the left column and try the steps on the right. If it is still not solved, contact support (section 13).", "இடது நெடுவரிசையில் உங்கள் சிக்கலைக் கண்டு வலதுபுறத்தில் உள்ள படிகளை முயலுங்கள். தீரவில்லை என்றால் ஆதரவைத் தொடர்பு கொள்ளுங்கள் (பிரிவு 13)."], ["tbl", ["Problem", "What to try"], [[["**The QR does not scan**", "**QR ஸ்கேன் ஆகவில்லை**"], ["Clean the QR. Check it is not scratched, faded or covered by glare. Scan from 15 to 30 cm in good light. If it is damaged, ask for a spare sticker.", "QR-ஐ சுத்தம் செய்யுங்கள். கீறல், மங்கல் அல்லது பிரதிபலிப்பு இல்லை என சரிபாருங்கள். நல்ல வெளிச்சத்தில் 15–30 செ.மீ. தூரத்தில் ஸ்கேன் செய்யுங்கள். சேதமடைந்திருந்தால் மாற்று ஸ்டிக்கர் கேளுங்கள்."]], [["**The scan page says the kit is not activated**", "**கிட் செயல்படுத்தப்படவில்லை என ஸ்கேன் பக்கம் சொல்கிறது**"], ["Your kit has not been activated yet. Follow section 3.", "உங்கள் கிட் இன்னும் செயல்படுத்தப்படவில்லை. பிரிவு 3-ஐப் பின்பற்றுங்கள்."]], [["**Someone scanned but I got no alert**", "**யாரோ ஸ்கேன் செய்தார், ஆனால் அறிவிப்பு வரவில்லை**"], ["Check that your account is Active, that you still have credits and that your plan has not ended. Make sure WhatsApp works on your registered number and that you have not blocked +91 91500 47587.", "கணக்கு Active ஆக உள்ளதா, கிரெடிட் உள்ளதா, திட்டம் முடியவில்லையா எனப் பாருங்கள். பதிவு எண்ணில் WhatsApp வேலை செய்கிறதா, +91 91500 47587-ஐ பிளாக் செய்யவில்லையா என உறுதி செய்யுங்கள்."]], [["**I do not receive the activation code**", "**செயல்படுத்தும் குறியீடு வரவில்லை**"], ["Send ACTIVATE from your registered number only. Check the ID, then send it again.", "பதிவு செய்த எண்ணிலிருந்து மட்டும் ACTIVATE அனுப்புங்கள். ஐடியைச் சரிபார்த்து மீண்டும் அனுப்புங்கள்."]], [["**I forgot my password**", "**கடவுச்சொல்லை மறந்து விட்டேன்**"], ["Use Forgot your password? on the sign-in page (section 5.3).", "உள்நுழைவு பக்கத்தில் Forgot your password? பயன்படுத்துங்கள் (பிரிவு 5.3)."]], [["**Sign-in is locked**", "**உள்நுழைவு பூட்டப்பட்டுள்ளது**"], ["Five wrong attempts lock sign-in for 15 minutes. Wait, then sign in again.", "ஐந்து தவறான முயற்சிகள் 15 நிமிடம் பூட்டும். காத்திருந்து மீண்டும் உள்நுழையுங்கள்."]], [["**The second number cannot be added**", "**இரண்டாவது எண்ணைச் சேர்க்க முடியவில்லை**"], ["The person must send JOIN and your Customer ID from the number you added. A number can belong to one account only. Check section 6.", "நீங்கள் சேர்த்த எண்ணிலிருந்து அவர் JOIN மற்றும் உங்கள் வாடிக்கையாளர் ஐடியை அனுப்ப வேண்டும். ஒரு எண் ஒரு கணக்கில் மட்டுமே இருக்கலாம். பிரிவு 6-ஐப் பாருங்கள்."]], [["**My credits look wrong**", "**கிரெடிட் இருப்பு தவறாகத் தெரிகிறது**"], ["Open Credits and plan in your account. If it still looks wrong, send support a screenshot.", "கணக்கில் Credits and plan-ஐத் திறவுங்கள். இன்னும் தவறாக இருந்தால் ஸ்கிரீன்ஷாட்டை ஆதரவுக்கு அனுப்புங்கள்."]], [["**The holder or sticker keeps falling off**", "**ஹோல்டர் அல்லது ஸ்டிக்கர் விழுந்து விடுகிறது**"], ["Clean and dry the surface, press firmly for 30 seconds, and avoid very hot or wet spots. Ask support for a replacement if needed.", "பரப்பைச் சுத்தம் செய்து உலர வைத்து 30 விநாடிகள் உறுதியாக அழுத்துங்கள்; மிகவும் சூடான அல்லது ஈரமான இடங்களைத் தவிருங்கள். தேவைப்பட்டால் மாற்று கேளுங்கள்."]]]], ["note", "**Still stuck?** Message support on WhatsApp at **+91 98405 47587** with your Customer ID and a short description. A photo or screenshot helps us resolve it faster.", "**இன்னும் சிக்கலா?** வாடிக்கையாளர் ஐடி மற்றும் சிறு விளக்கத்துடன் **+91 98405 47587** என்ற WhatsApp எண்ணில் ஆதரவுக்குச் செய்தி அனுப்புங்கள். புகைப்படம் அல்லது ஸ்கிரீன்ஷாட் விரைவாகத் தீர்க்க உதவும்."]]}, {"n": 13, "t": ["Contact and seller details", "தொடர்பு மற்றும் விற்பனையாளர் விவரம்"], "sub": null, "cont": false, "blocks": [["h", "13.1", "Customer support", "வாடிக்கையாளர் ஆதரவு"], ["tbl", null, [[["WhatsApp", "WhatsApp"], ["+91 98405 47587 (support and orders)", "+91 98405 47587 (ஆதரவு மற்றும் ஆர்டர்கள்)"]], [["Support hours", "ஆதரவு நேரம்"], ["Monday to Saturday, 10:00 AM to 6:00 PM IST", "திங்கள் முதல் சனி, காலை 10:00 – மாலை 6:00 (IST)"]], [["Website", "இணையதளம்"], ["pingmeconnect.in", "pingmeconnect.in"]], [["Your account", "உங்கள் கணக்கு"], ["pingmeconnect.in/account", "pingmeconnect.in/account"]], [["Activation", "செயல்படுத்தல்"], ["pingmeconnect.in/activate", "pingmeconnect.in/activate"]]]], ["p", "The number +91 91500 47587 sends your alerts and activation codes. It is not a support line.", "+91 91500 47587 எண் உங்கள் அறிவிப்புகளையும் செயல்படுத்தும் குறியீடுகளையும் அனுப்புகிறது. இது ஆதரவு எண் அல்ல."], ["h", "13.2", "Complaints and grievances", "புகார்கள் மற்றும் குறைதீர்ப்பு"], ["p", "If you are not satisfied, write to our **Grievance contact: Proprietor, Bharani Innovations** on WhatsApp +91 98405 47587 with your Customer ID and details. We acknowledge your complaint and work to resolve it within a reasonable time. You may also use your rights under consumer protection law.", "திருப்தி இல்லையெனில், வாடிக்கையாளர் ஐடி மற்றும் விவரங்களுடன் எங்கள் **குறைதீர்ப்பு தொடர்பு: உரிமையாளர், Bharani Innovations** அவர்களுக்கு WhatsApp +91 98405 47587-ல் எழுதுங்கள். புகாரை ஏற்று நியாயமான காலத்தில் தீர்க்க முயல்வோம். நுகர்வோர் பாதுகாப்புச் சட்டத்தின் கீழ் உங்கள் உரிமைகளையும் பயன்படுத்தலாம்."], ["h", "13.3", "Seller details", "விற்பனையாளர் விவரம்"], ["tbl", null, [[["Business name", "நிறுவனப் பெயர்"], ["Bharani Innovations (proprietorship)", "Bharani Innovations (தனி உரிமையாளர் நிறுவனம்)"]], [["Brand", "பிராண்ட்"], ["PingMe", "PingMe"]], [["Address", "முகவரி"], ["Madambakkam, Chennai 600 126, Tamil Nadu, India", "மடம்பாக்கம், சென்னை 600 126, தமிழ்நாடு, இந்தியா"]]]], ["h", "13.4", "Policies and documents", "கொள்கைகள் மற்றும் ஆவணங்கள்"], ["ul", [["Genuine Use Declaration: pingmeconnect.in/legal/genuine-use.html", "உண்மையான பயன்பாட்டு உறுதிமொழி: pingmeconnect.in/legal/genuine-use.html"], ["Terms of Use: pingmeconnect.in/legal/terms.html", "பயன்பாட்டு விதிமுறைகள்: pingmeconnect.in/legal/terms.html"], ["Privacy Notice: pingmeconnect.in/legal/privacy.html", "தனியுரிமை அறிவிப்பு: pingmeconnect.in/legal/privacy.html"], ["Refund, Shipping and Credits policies: pingmeconnect.in/legal", "பணத் திரும்பல், ஷிப்பிங், கிரெடிட் கொள்கைகள்: pingmeconnect.in/legal"]]], ["p", "This guide gives a summary. If anything here differs from the policies on our website, the published policies apply. They may be updated from time to time, and the current version is always on pingmeconnect.in.", "இந்த வழிகாட்டி சுருக்கமே. இதில் உள்ளதற்கும் இணையதளக் கொள்கைகளுக்கும் வேறுபாடு இருந்தால், வெளியிடப்பட்ட கொள்கைகளே பொருந்தும். அவை அவ்வப்போது புதுப்பிக்கப்படலாம்; தற்போதைய பதிப்பு எப்போதும் pingmeconnect.in-ல் இருக்கும்."]]}]};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
function blk(b,L){var k=b[0],o;
if(k=="part")return '<div class="part">'+md(b[1+L])+'</div>';
if(k=="h")return '<h3><span>'+b[1]+'</span>'+md(b[2+L])+'</h3>';
if(k=="p")return '<p>'+md(b[1+L])+'</p>';
if(k=="ul"||k=="ol")return '<'+k+'>'+b[1].map(function(x){return '<li>'+md(x[L])+'</li>'}).join("")+'</'+k+'>';
if(k=="note"||k=="warn")return '<div class="'+k+'">'+md(b[1+L])+'</div>';
if(k=="flow")return '<div class="flow">'+b[1].map(function(x,i){return '<div><i>'+(i+1)+'</i><b>'+md(x[L])+'</b><small>'+md(x[2+L])+'</small></div>'}).join("")+'</div>';
if(k=="tbl"){o='<table>';if(b[1])o+='<tr>'+b[1].map(function(h){return '<th>'+md(L?(D.head[h]||h):h)+'</th>'}).join("")+'</tr>';
b[2].forEach(function(r){o+='<tr>'+r.map(function(c){return '<td>'+md(c[L])+'</td>'}).join("")+'</tr>'});return o+'</table>'}
return ''}
function render(l){var L=l=="ta"?1:0,u=UI[l];document.documentElement.lang=l;
document.getElementById("h-k").textContent=u.k;document.getElementById("h-t").textContent=u.t;document.getElementById("h-p").textContent=u.p;document.getElementById("pr").textContent=u.pr;document.getElementById("foot").textContent=u.f;
document.getElementById("b-en").className=L?"":"on";document.getElementById("b-ta").className=L?"on":"";
document.getElementById("toc").innerHTML='<h2>'+u.c+'</h2>'+D.toc.map(function(t,i){return '<a href="#s'+(i+1)+'"><b>'+(i+1)+'</b><span>'+esc(t[L?1:0])+'<small>'+esc(t[L?3:2])+'</small></span></a>'}).join("");
document.getElementById("secs").innerHTML=D.sections.map(function(s){return '<section class="sec" id="s'+s.n+'"><h2 class="t"><i>'+s.n+'</i>'+esc(s.t[L])+'</h2>'+s.blocks.map(function(b){return blk(b,L)}).join("")+'</section>'}).join("");
try{localStorage.setItem("pmLang",l)}catch(e){}}
var cur="en";try{cur=localStorage.getItem("pmLang")||((navigator.language||"").slice(0,2)=="ta"?"ta":"en")}catch(e){}
if(/[?&]lang=ta/.test(location.search))cur="ta";if(/[?&]lang=en/.test(location.search))cur="en";
document.getElementById("b-en").onclick=function(){render("en")};document.getElementById("b-ta").onclick=function(){render("ta")};render(cur);
